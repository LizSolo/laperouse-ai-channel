name: Watchdog — did the morning run deliver?

on:
  schedule:
    # 05:40 UTC = 12:40 по Бангкоку. Автор стартует в 09:00, редактор в 11:40 —
    # час запаса после редактора, чтобы долгий прогон не выглядел как сбой.
    # Сдвинуто 13.08 вместе с редактором: в режиме отбора тем больше, и прежние
    # 40 минут до редактора заставляли автора обрывать очередь (T-10).
    - cron: "40 5 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that DRAFTS.md and REVIEW.md were updated today
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/watchdog.py
