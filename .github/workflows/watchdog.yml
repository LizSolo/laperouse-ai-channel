name: Watchdog — did the morning run deliver?

on:
  schedule:
    # 04:00 UTC = 11:00 по Бангкоку. Автор стартует в 09:00, редактор в 09:40 —
    # час запаса после редактора, чтобы долгий прогон не выглядел как сбой.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that DRAFTS.md and REVIEW.md were updated today
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/watchdog.py
